# Caswell Pines, holes 2-18: routing draft (session 3, 2026-11-23).
#
# Read off the 2024 NC orthoimagery and the 2024 QL1 lidar hillshade, with the scorecard yardages
# and the flyover notes (docs/reference/caswell-pines/holes-*.md) for direction and sides.
# Course frame: meters east (x) and south (z) of the pin. `gce-route` turns this table into
# authoring/holes.json; `gce-author` compiles that into overrides.geojson.
#
# Per hole:
#   green      auto-traced green center (the outline comes from the turf-color trace)
#   line       fairway centerline, tee end first, ending at the green center
#   path       "left" | "right" of the line as played, for the hole's cart path
#   bunkers    [along_m_from_green, side_m (+ right, - left as played), semi_a, semi_b]
#   path_from_m / path_end_past_m  optional trims where the path would clip a green or a pond
#   confidence "high" | "medium" | "low": how sure the routing is (for John's review)
#
# Tee pads go on the centerline at each tee's scorecard distance (yards) from the green center.

yards_to_m = 0.9144
tee_size_m = [12.0, 8.0]
bunker_clear_green_m = 1.5        # bunkers are pushed out from the green until this far off its edge          # length along the line, width
fairway_from_forward_tee_m = 35.0 # fairway starts this far in front of the forward (red) tee
fairway_end_short_m = 14.0        # ... and ends this far short of the green center
fairway_half_m = [16.0, 22.0, 13.0] # half-width at the start, in the landing zone, near the green
landing_m = [200.0, 260.0]        # landing zone, meters from the blue tee
path_offset_m = 9.0               # cart path this far outside the fairway edge
path_start_back_m = 10.0          # path starts this far behind the back tee
path_end_past_m = 25.0            # and ends this far past the green center
path_clear_green_m = 6.0          # paths are cut back this far from every green
path_clear_water_m = 4.0          # ... and from every pond
path_clear_tee_m = 2.0            # ... every tee
path_clear_bunker_m = 2.0         # ... and every bunker
path_min_gap_m = 6.0              # two paths may not run closer than this ...
path_max_parallel_m = 15.0        # ... for longer than this (crossings are fine)
# Connectors without `via` are routed round greens, tees, bunkers and ponds (gce-route auto_route).
connector = { search_m = 120.0, corner_m = 2.0, corner_gap_m = 20.0, fairway_cost = 1.0, beside_path_cost = 10.0, crossing_cost = 40.0 }

