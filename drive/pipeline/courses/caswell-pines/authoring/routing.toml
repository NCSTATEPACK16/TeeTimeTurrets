# Ponds: the two big ones are auto-traced from the aerial; the two by hole 4 are traced by hand
# from the hillshade review crop (pond outlines in course frame). `wade` marks a wading shelf.
[ponds.pond-big]
trace = [384, -2]

[ponds.pond-long]
trace = [685, -126]

[ponds.pond-h4-west]
xz = [[750, 546], [770, 541], [792, 543], [800, 552], [798, 566], [784, 580], [762, 581], [749, 570], [746, 554]]

[ponds.pond-h4-east]
xz = [[806, 574], [822, 570], [838, 580], [842, 596], [832, 604], [815, 600], [806, 588]]

[wade]
# A wading shelf on the big pond's south-west shore (qa.waterEntry), as [cx, cz, semi_a, semi_b, bearing].
pond = "pond-big"
ellipse = [352, 50, 26, 16, 45]

# Connectors: cart paths that join the holes into one network, in playing order. Ends are
# "clubhouse", [x, z], "<path id>:start|end", or a bare "<path id>" (its nearest point: a T-junction),
# so they follow routing edits; `via` points steer
# round greens, tees, bunkers and ponds, which gce-route refuses to let a connector touch.
[clubhouse]
at = "h01-path-east:start"   # the cart path leaves the clubhouse's south side for the 1st tee

[[connectors]]
id = "conn-01-02"
from = "h01-path-east:end"
to = "h02-path"

[[connectors]]
id = "conn-02-03"
from = "h02-path:end"
to = "h03-path"

[[connectors]]
