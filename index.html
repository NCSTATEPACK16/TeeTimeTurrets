<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeeTimeTurrets</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: 240px;
        font: 13px system-ui, sans-serif;
        color: #eee;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      #power-track {
        margin-top: 6px;
        width: 100%;
        height: 10px;
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 4px;
        overflow: hidden;
        background: rgba(0,0,0,0.4);
      }
      #power-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6cf, #f66);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div>&larr;/&rarr; aim &middot; hold Space to charge &middot; release to swing &middot; R to reset</div>
      <div id="power-track"><div id="power-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
