<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeeTimeTurrets</title>
    <!-- Inline so there is no asset to fetch (and no 404 in the console): a golf ball over the
         tee-green of the course. Data URI keeps the zero-external-asset rule intact. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234caf50'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%23fff'/%3E%3Ccircle cx='13' cy='12' r='1.3' fill='%23d8d8d8'/%3E%3Ccircle cx='19' cy='12' r='1.3' fill='%23d8d8d8'/%3E%3Ccircle cx='16' cy='16' r='1.3' fill='%23d8d8d8'/%3E%3Crect x='11' y='24' width='10' height='3' rx='1.5' fill='%23205c33'/%3E%3C/svg%3E"
    />
    <style>
      /* UI-SPEC.md section 6's visual language, stated once as tokens instead of retyped per
         rule. Before this the panel fill and the orange accent were hand-typed literals in two
         places each; the clubhouse would have been the third. Every value below is the one that
         was already in use -- this is an extraction, not a restyle. */
      :root {
        --panel: rgba(16, 20, 24, 0.62);
        --panel-solid: rgba(16, 20, 24, 0.94);
        --panel-raised: rgba(30, 36, 42, 0.94);
        --scrim: rgba(8, 12, 16, 0.72);
        --ink: #fff;
        --ink-dim: rgba(255, 255, 255, 0.62);
        --accent: #ef8a2b;          /* the single accent, reserved for the primary action */
        --accent-ink: #14181c;
        --hp-green: #46c46a;
        /* H13 team colours. Blue and orange rather than green and red: the health bar already
           owns green-to-red, and a red name over a red bar is unreadable at plate size. */
        --team-ally: #6fb6ff;
        --team-enemy: #ff9a5c;
        --ammo-orange: #ff9d3d;
        --danger: #e8564a;
        --status: #ffe27a;
        --track: rgba(0, 0, 0, 0.5);
        --radius-pill: 6px;
        --radius-card: 8px;
        --radius-modal: 12px;
        --font: 600 13px system-ui, sans-serif;
        --track-letter: 0.06em;
      }

      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* Screens build their own DOM into here on enter() and strip it on exit(), so a screen's
         markup has the same lifetime as its scene. That is the Phase 1.75 disposal rule applied
         to the DOM as well as to GPU resources -- markup parked in index.html would outlive the
         screen that owns it and quietly accumulate listeners. */
      #screens { position: fixed; inset: 0; z-index: 20; }
      /* Click-through except where a screen is actually showing: the match's pause overlay lives
         here hidden for the whole match, and an :empty rule would let it block the canvas. */
      #screens { pointer-events: none; }
      #screens > :not([hidden]) { pointer-events: auto; }

      #hud[hidden] { display: none; }
      #hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: 320px;
        font: 13px system-ui, sans-serif;
        color: #eee;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      #hud-row {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }
      #hud-status { min-height: 1.2em; color: var(--status); margin-top: 5px; }
      #hud-timer { font-variant-numeric: tabular-nums; }
      #hud-help { margin-top: 8px; opacity: 0.7; font-size: 11px; }

      /* Event banner (UI-SPEC H12): a screen-anchored headline that flashes on a match event and
         fades out. Opacity is written every frame by drawBanner; the [hidden] rule covers the
         no-banner case so a faded-to-zero element is not left catching pointer events. */
      #event-banner[hidden] { display: none; }
      #event-banner {
        position: fixed;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        pointer-events: none;
        text-align: center;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        will-change: opacity;
      }
      #banner-headline {
        font: 800 40px system-ui, sans-serif;
        letter-spacing: 0.08em;
        color: var(--danger);
      }
      #banner-consequence {
        margin-top: 6px;
        font: 700 18px system-ui, sans-serif;
        letter-spacing: var(--track-letter);
        color: var(--status);
      }

      /* Hit markers (UI-SPEC H11): one-shot callouts at a hit's projected screen point. Each node
         positions itself with left/top and animates transform + opacity, then removes itself on
         animationend. The container never scrolls. */
      #hit-markers { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .hit-marker {
        position: absolute;
        font: 800 22px system-ui, sans-serif;
        letter-spacing: 0.04em;
        white-space: nowrap;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
        /* Anchor the text on the point rather than hanging off its top-left corner. */
        translate: -50% -50%;
        animation: hit-marker-rise 1s ease-out forwards;
      }
      .hit-marker--hit { color: #fff; }
      .hit-marker--kill { color: var(--danger); font-size: 26px; }
      @keyframes hit-marker-rise {
        0% { transform: translateY(6px) scale(0.9); opacity: 0; }
        18% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-34px) scale(1); opacity: 0; }
      }
      /* Stage 2 feedback. All overlays, no pointer events, and all siblings after #hud so they hide
         with it (`#hud[hidden] ~`) without a line of JS each. The vignette and the damage flash sit
         early in the DOM, below the HUD's text; the score strip and the kill feed sit after it. */
      #lowhp-vignette, #damage-flash { position: fixed; inset: 0; pointer-events: none; }
      #lowhp-vignette {
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 16, 12, 0.85) 100%);
      }
      #hud[hidden] ~ #score-strip, #hud[hidden] ~ #kill-feed { display: none; }
      .damage-wedge {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        opacity: 0;
      }
      /* A wedge at the edge of a circle round the screen's centre, pointing out toward the shooter.
         The parent rotates; the child is pushed up along the rotated axis. */
      .damage-wedge::before {
        content: "";
        position: absolute;
        left: -90px;
        top: calc(-1 * min(38vh, 38vw));
        width: 180px;
        height: 34px;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        background: radial-gradient(ellipse at 50% 100%, rgba(255, 60, 40, 0.95), rgba(255, 60, 40, 0) 70%);
      }
      #score-strip {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 16px;
        border-radius: var(--radius-pill);
        background: var(--panel);
        font: 800 18px system-ui, sans-serif;
        letter-spacing: 0.08em;
        color: var(--ink);
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .score-strip--pulse { animation: score-pulse 0.6s ease-out; }
      @keyframes score-pulse {
        0% { transform: translateX(-50%) scale(1.25); background: rgba(232, 86, 74, 0.8); }
        100% { transform: translateX(-50%) scale(1); }
      }
      #kill-feed {
        position: fixed;
        top: 12px;
        right: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font: var(--font);
        letter-spacing: var(--track-letter);
        pointer-events: none;
      }
      .kill-line {
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        background: var(--panel);
        color: var(--ink-dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .kill-line[hidden] { display: none; }
      .kill-name--self { color: var(--status); }
      .kill-name--ally { color: var(--team-ally); }
      .kill-name--enemy { color: var(--team-enemy); }
      #power-track {
        margin-top: 6px;
        width: 100%;
        height: 10px;
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 4px;
        overflow: hidden;
        background: rgba(0,0,0,0.4);
      }
      #power-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6cf, #f66);
      }

      /* UI-SPEC section 6: dark translucent rounded rectangles, white bold condensed type.
         Bottom-left, the corner image 06 and image 08 put ammo and health in, and placed so
         Phase 4 can lay the full image-08 set out around them without moving them. */
      #hud-combat {
        position: fixed;
        left: 24px;
        bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font: var(--font);
        letter-spacing: 0.06em;
        color: #fff;
        pointer-events: none;
      }
      #hud-combat[hidden] { display: none; }

      /* UI-SPEC H13. Built once and repositioned per frame, unlike the one-shot hit markers.
         No z-index of its own (auto), same as #hud/#hud-combat, so any screen above them covers the
         plates too. Placed early in the DOM (right after #app) so it stacks below #hud/#hud-combat,
         which come later -- the plates read as part of the world, not the cockpit. */
      #nameplates { position: fixed; inset: 0; pointer-events: none; }
      .nameplate {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--panel);
        font: 600 11px system-ui, sans-serif;
        letter-spacing: 0.08em;
        color: #fff;
        white-space: nowrap;
      }
      .nameplate[hidden] { display: none; }
      .nameplate-track {
        width: 62px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: var(--track);
      }
      .nameplate-fill { height: 100%; width: 100%; background: var(--hp-green); }
      /* H13's distance line. `:empty` collapses it rather than leaving a gap, which is what
         happens past 300 m where plateState.ts drops the number on purpose. */
      .nameplate-distance {
        font: 600 10px system-ui, sans-serif;
        letter-spacing: 0.06em;
        opacity: 0.82;
      }
      .nameplate-distance:empty { display: none; }
      /* Team colour is on the name alone: the plate's own panel stays neutral so a row of plates
         reads as one family, and the health bar keeps its own red-to-green meaning. */
      .nameplate-ally .nameplate-name { color: var(--team-ally); }
      .nameplate-enemy .nameplate-name { color: var(--team-enemy); }

      /* H8, the course map. Centred rather than full-bleed: the round keeps running underneath and
         the player is still being shot at, so the map deliberately does not cover the edges of
         frame where movement is read. `hidden` rather than opacity, so a closed map costs no
         compositing. Sized in vmin so it stays square-ish on any viewport, which matters because
         the projection fits one scale to both axes. */
      .course-map {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(74vmin, 720px);
        height: min(74vmin, 720px);
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel-solid);
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      .course-map[hidden] { display: none; }
      .course-map-canvas { display: block; width: 100%; height: 100%; }

      .hud-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        border-radius: 8px;
        background: var(--panel);
      }
      #health-track {
        width: 132px;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        background: var(--track);
      }
      #health-fill {
        height: 100%;
        width: 100%;
        background: var(--hp-green);
        transition: width 90ms linear;
      }
      #health-icon { color: var(--danger); font-size: 15px; }
      #ammo-count { color: var(--ammo-orange); font-size: 17px; }


      /* ---- Shared screen vocabulary (Phase 1.75) ------------------------------------------
         Buttons, panels, stat tiles and the scorecard grid, defined once because the title,
         results and clubhouse screens are three views of the same visual language and there is
         nothing to reuse otherwise -- UI-SPEC section 6 describes it in prose and this is that
         prose made into rules. */

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        font: var(--font);
        letter-spacing: var(--track-letter);
        color: var(--ink);
      }
      .screen--scrim { background: var(--scrim); }

      .btn {
        appearance: none;
        border: 0;
        border-radius: var(--radius-card);
        padding: 12px 22px;
        background: var(--panel-solid);
        color: var(--ink);
        font: var(--font);
        font-size: 15px;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: filter 120ms linear, transform 120ms ease-out;
      }
      .btn:hover:not(:disabled) { filter: brightness(1.25); }
      .btn:active:not(:disabled) { transform: translateY(1px); }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      /* Disabled means visibly disabled, not dead: ROADMAP.md asks for buttons to unbuilt
         screens to read as "not yet", never as a click that silently does nothing. */
      .btn:disabled { opacity: 0.38; cursor: not-allowed; }
      .btn--primary { background: var(--accent); color: var(--accent-ink); }
      .btn--wide { width: 100%; }

      /* Settings panel, the Settings screen and the pause overlay (Stage 2). */
      .settings { display: grid; gap: 10px; margin: 6px 0 16px; }
      .settings__row { display: grid; grid-template-columns: 150px 1fr 56px; align-items: center; gap: 12px; }
      .settings__label { color: var(--ink-dim); }
      .settings__range { width: 100%; accent-color: var(--accent); }
      .settings__value { text-align: right; font-variant-numeric: tabular-nums; }
      .settings__select { background: rgba(0, 0, 0, 0.45); color: var(--ink); border: 1px solid var(--ink-dim); padding: 4px 6px; font: inherit; }
      .settings__note { margin: 0; color: var(--ink-dim); font-size: 12px; }
      .settings-screen, .pause { align-items: center; justify-content: center; }
      .settings-screen__panel, .pause__panel { width: min(520px, 92vw); max-height: 92vh; overflow: auto; }
      .settings-screen__title, .pause__title { margin: 0 0 14px; font: 800 28px system-ui, sans-serif; letter-spacing: 0.1em; }
      .pause[hidden] { display: none; }
      .pause__actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
      .controls { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
      .controls dt { color: var(--status); }
      .controls dd { margin: 0; color: var(--ink-dim); }
      .panel {
        background: var(--panel-solid);
        border-radius: var(--radius-modal);
        padding: 22px 26px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 13px;
        border-radius: 999px;
        background: var(--panel-solid);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .chip__coin { color: var(--accent); font-size: 17px; }

      .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .tile {
        background: var(--panel-raised);
        border-radius: var(--radius-card);
        padding: 12px 14px;
        text-align: center;
      }
      .tile__label { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.12em; }
      .tile__value {
        margin-top: 5px;
        font-size: 21px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      .swatches { display: flex; gap: 5px; }
      .swatch {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .swatch--on { border-color: var(--ink); }
      .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .swatch:disabled { opacity: 0.3; cursor: not-allowed; }

      .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
      /* A near-zero bar still shows a sliver: an empty track reads as a missing value
         rather than as the smallest of three. */
      .meter__fill { height: 100%; min-width: 3px; background: var(--accent); }

      /* ---- S1 Title (image 10) ------------------------------------------------------------
         Logo top-left, actions right, version bottom-right, live course behind. The panel is
         only the type: the backdrop is the WebGL canvas showing through. */
      .title { padding: 44px 52px; }
      .title__brand { position: absolute; top: 44px; left: 52px; }
      .title__logo {
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 0.98;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
      }
      .title__logo--alt { color: var(--accent); }
      .title__menu {
        position: absolute;
        right: 52px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 11px;
        width: 246px;
      }
      .title__version {
        position: absolute;
        right: 52px;
        bottom: 30px;
        font-size: 11px;
        color: var(--ink-dim);
      }

      /* ---- Arena results (D12) --------------------------------------------------------------
         The team score, MVP and full roster, over PLAY AGAIN / MAIN MENU. `matchScoreboard.ts`'s
         `deriveScoreboard` supplies every string and row here; this file only lays them out.
         `#screens`' own z-index (20) keeps it above `#hud` (auto), the same as CLUBHOUSE. */
      .arena-results { align-items: center; justify-content: center; padding: 24px; }
      .arena-results__panel { width: min(460px, 100%); text-align: center; }
      .arena-results__title { margin: 0 0 18px; font-size: 30px; letter-spacing: 0.14em; }
      .arena-results__score {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin-bottom: 10px;
        font-size: 17px;
        font-variant-numeric: tabular-nums;
      }
      .arena-results__score-value { color: var(--accent); }
      .arena-results__mvp {
        margin: 0 0 18px;
        font-size: 13px;
        color: var(--ink-dim);
        letter-spacing: 0.08em;
      }
      .arena-results__rows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
      .arena-results__row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 14px;
        padding: 7px 11px;
        border-radius: var(--radius-pill);
        background: var(--panel-raised);
        font-size: 12px;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      .arena-results__row-name--ally { color: var(--team-ally); }
      .arena-results__row-name--enemy { color: var(--team-enemy); }
      .arena-results__row-stat { color: var(--ink-dim); letter-spacing: 0.04em; }
      .arena-results__reward { display: flex; flex-direction: column; gap: 3px; margin-bottom: 16px; }
      .arena-results__reward-score { font-size: 20px; letter-spacing: 0.1em; color: var(--accent); }
      .arena-results__reward-line { color: var(--ink-dim); letter-spacing: 0.05em; }
      .arena-results__reward-level { color: var(--accent); letter-spacing: 0.12em; }
      .arena-results__actions { display: flex; gap: 11px; margin-top: 8px; }
      .arena-results__actions .btn { flex: 1; }

      /* ---- S3 Clubhouse loadout (image 11) --------------------------------------------------
         Categories left, club stat cards right, coins top-right, BACK/CONFIRM bottom. The middle
         is deliberately empty: that is the turntable, rendered on the shared canvas behind. */
      .clubhouse { padding: 30px 34px; pointer-events: none; }
      .clubhouse > * { pointer-events: auto; }

      .clubhouse__categories {
        position: absolute;
        left: 34px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 9px;
        width: 250px;
      }
      .clubhouse__category {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 13px;
        border-radius: var(--radius-card);
        background: var(--panel-solid);
      }
      .clubhouse__category-label { font-size: 12px; letter-spacing: 0.1em; }

      .clubhouse__coins { position: absolute; top: 30px; right: 34px; }

      /* Upgrades sit top-left, above the categories: bought at once, no preview. */
      .clubhouse__upgrades {
        position: absolute;
        left: 34px;
        top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 250px;
        padding: 11px 13px;
        border-radius: var(--radius-card);
        background: var(--panel-solid);
      }
      .clubhouse__upgrade { font-size: 12px; padding: 7px 10px; text-align: left; }
      .clubhouse__note { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.06em; }

      .clubhouse__clubs {
        position: absolute;
        right: 34px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 9px;
        width: 296px;
      }
      .club-card {
        appearance: none;
        border: 2px solid transparent;
        border-radius: var(--radius-card);
        background: var(--panel-solid);
        color: var(--ink);
        font: var(--font);
        letter-spacing: var(--track-letter);
        padding: 12px 14px;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .club-card:hover { filter: brightness(1.2); }
      .club-card--on { border-color: var(--accent); }
      .club-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .club-card__name { font-size: 13px; letter-spacing: 0.12em; }
      .club-card__bars { display: flex; flex-direction: column; gap: 5px; }
      .club-card__row { display: grid; grid-template-columns: 54px 1fr 42px; align-items: center; gap: 8px; }
      .club-card__stat { font-size: 9px; color: var(--ink-dim); letter-spacing: 0.1em; }
      .club-card__detail {
        font-size: 10px;
        color: var(--ink-dim);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .clubhouse__actions {
        position: absolute;
        left: 34px;
        right: 34px;
        bottom: 30px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      /* CONFIRM is the primary action and image 11 draws it wide; BACK stays a plain pill. */
      .clubhouse__actions .btn--primary { flex: 1; max-width: 420px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="lowhp-vignette"></div>
    <div id="damage-flash"></div>
    <div id="nameplates"></div>
    <!-- Screens mount their own markup here and strip it on exit. Empty by design. -->
    <div id="screens"></div>
    <div id="hud-combat" hidden>
      <div class="hud-card">
        <span id="health-icon">&#9829;</span>
        <div id="health-track"><div id="health-fill"></div></div>
        <span id="health-text">100</span>
      </div>
      <div class="hud-card">
        <span>AMMO</span>

      <div id="hud-row">

        <span id="hud-club">DRIVER</span>
        <!-- Empty by design, and it is not a stylistic choice: `docs/TEST-AND-SPEC-PITFALLS.md`

        <span id="hud-points"></span>
      </div>
      <div id="power-track"><div id="power-fill"></div></div>
      <div id="hud-status"></div>
      <div id="hud-help">
        WASD drive &middot; F or Space fire &middot; mouse/Q/E aim &middot; 1-2-3 club &middot; Shift brake &middot;

    </div>

    <div id="score-strip"><span id="hud-team-score"></span></div>
    <div id="kill-feed"></div>
    <div id="event-banner" hidden>

      <div id="banner-consequence"></div>
    </div>
    <div id="hit-markers"></div>
    <script type="module" src="/src/main.ts"></script>
