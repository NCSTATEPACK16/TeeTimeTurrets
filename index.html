<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeeTimeTurrets</title>
    <!-- Inline so there is no asset to fetch (and no 404 in the console): a golf ball over the
         tee-green of the course. Data URI keeps the zero-external-asset rule intact. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234caf50'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%23fff'/%3E%3Ccircle cx='13' cy='12' r='1.3' fill='%23d8d8d8'/%3E%3Ccircle cx='19' cy='12' r='1.3' fill='%23d8d8d8'/%3E%3Ccircle cx='16' cy='16' r='1.3' fill='%23d8d8d8'/%3E%3Crect x='11' y='24' width='10' height='3' rx='1.5' fill='%23205c33'/%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: 320px;
        font: 13px system-ui, sans-serif;
        color: #eee;
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      #hud-row {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }
      #hud-status { min-height: 1.2em; color: #ffe27a; margin-top: 5px; }
      #hud-timer { font-variant-numeric: tabular-nums; }
      #hud-help { margin-top: 8px; opacity: 0.7; font-size: 11px; }
      #power-track {
        margin-top: 6px;
        width: 100%;
        height: 10px;
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 4px;
        overflow: hidden;
        background: rgba(0,0,0,0.4);
      }
      #power-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6cf, #f66);
      }

      /* UI-SPEC section 6: dark translucent rounded rectangles, white bold condensed type.
         Bottom-left, the corner image 06 and image 08 put ammo and health in, and placed so
         Phase 4 can lay the full image-08 set out around them without moving them. */
      #hud-combat {
        position: fixed;
        left: 24px;
        bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font: 600 13px system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: #fff;
        pointer-events: none;
      }
      #hud-combat[hidden] { display: none; }

      /* UI-SPEC H13. Built once and repositioned per frame, unlike the one-shot hit markers.
         No z-index of its own (auto), same as #hud/#hud-combat: #match-results' explicit
         z-index: 10 already lifts it above every auto sibling regardless of DOM order, so the
         results card still covers the plates at the buzzer without this needing to know about
         it. Placed early in the DOM (right after #app) so it stacks below #hud/#hud-combat,
         which come later -- the plates read as part of the world, not the cockpit. */
      #nameplates { position: fixed; inset: 0; pointer-events: none; }
      .nameplate {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(16, 20, 24, 0.62);
        font: 600 11px system-ui, sans-serif;
        letter-spacing: 0.08em;
        color: #fff;
        white-space: nowrap;
      }
      .nameplate[hidden] { display: none; }
      .nameplate-track {
        width: 62px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.5);
      }
      .nameplate-fill { height: 100%; width: 100%; background: #46c46a; }
      .hud-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        border-radius: 8px;
        background: rgba(16, 20, 24, 0.62);
      }
      #health-track {
        width: 132px;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.5);
      }
      #health-fill {
        height: 100%;
        width: 100%;
        background: #46c46a;
        transition: width 90ms linear;
      }
      #health-icon { color: #e8564a; font-size: 15px; }
      #ammo-count { color: #ff9d3d; font-size: 17px; }

      /* UI-SPEC section 6's visual language: dark translucent card, white bold condensed type.
         Not S2's full nine-column scorecard -- that is Phase 1.75's screen, and this is one
         overlay gated by one boolean. */
      #match-results {
        position: fixed;
        inset: 0;
        /* #hud has no z-index of its own (auto), so without one here it paints on top of this
           backdrop despite coming earlier in the DOM -- the match freezes but the timer and
           status line stay lit above the dimmed scene. A positive z-index lifts this overlay
           into its own paint layer above every z-index:auto sibling, matching how a modal
           backdrop is expected to occlude the page behind it. */
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 16, 0.72);
        font: 600 15px system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: #fff;
      }
      #match-results[hidden] { display: none; }
      #results-card {
        min-width: 300px;
        padding: 28px 34px;
        border-radius: 12px;
        background: rgba(16, 20, 24, 0.94);
        text-align: center;
      }
      #results-headline { margin: 0 0 18px; font-size: 30px; letter-spacing: 0.1em; }
      #results-scores {
        display: flex;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 22px;
        font-size: 17px;
        font-variant-numeric: tabular-nums;
      }
      #play-again {
        width: 100%;
        padding: 11px 0;
        border: 0;
        border-radius: 8px;
        background: #ef8a2b;
        color: #14181c;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="nameplates"></div>
    <div id="hud-combat" hidden>
      <div class="hud-card">
        <span id="health-icon">&#9829;</span>
        <div id="health-track"><div id="health-fill"></div></div>
        <span id="health-text">100</span>
      </div>
      <div class="hud-card">
        <span>AMMO</span>
        <span id="ammo-count">0</span>
      </div>
    </div>
    <!-- Empty by design: review round 1 caught a placeholder "DRAW"/"YOU 0"/"BOT 0" here making
         the smoke check for these elements pass even with drawMatchResults never called. Blank
         markup means the check can only pass because the writer actually ran. -->
    <div id="match-results" hidden>
      <div id="results-card">
        <h1 id="results-headline"></h1>
        <div id="results-scores">
          <span id="results-you"></span>
          <span id="results-bot"></span>
        </div>
        <button id="play-again" type="button">PLAY AGAIN</button>
      </div>
    </div>
    <div id="hud">
      <div id="hud-row">
        <span id="hud-timer">3:00</span>
        <span id="hud-club">DRIVER</span>
        <span id="hud-strokes">STROKES 0</span>
      </div>
      <div id="power-track"><div id="power-fill"></div></div>
      <div id="hud-status"></div>
      <div id="hud-help">
        WASD drive &middot; F or Space fire &middot; mouse/Q/E aim &middot; 1-2-3 club &middot; Shift brake &middot;
        hold to charge, release to shoot &middot; R reset
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
